services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ba-agent-postgres
    environment:
      POSTGRES_USER: ba
      POSTGRES_PASSWORD: ba
      POSTGRES_DB: ba_agent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ba -d ba_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Added in M3 (FastAPI backend) and M4 (React frontend):
  # backend:
  #   build: ./backend
  #   env_file: .env
  #   ports: ["8000:8000"]
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  # frontend:
  #   build: ./frontend
  #   ports: ["5173:80"]
  #   depends_on:
  #     - backend

volumes:
  pgdata:
